model_list:
  - model_name: "gpt-5.4"
    litellm_params:
      model: "openai/gpt-5.4"
      api_key: "os.environ/OPENAI_API_KEY"
      extra_headers:
        X-Session-Id: "circle_packing"   # for recording purpose
  - model_name: "claude-sonnet-4-6"
    litellm_params:
      model: "anthropic/claude-sonnet-4-6"
      api_key: "os.environ/ANTHROPIC_API_KEY"
      extra_headers:
        X-Session-Id: "circle_packing"   # for recording purpose

litellm_settings:
  drop_params: true
