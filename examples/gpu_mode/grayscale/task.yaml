task:
  name: "GPU Mode: Grayscale"
  description: |
    Optimize a Triton kernel for RGB → grayscale conversion using the luminance
    formula: Y = 0.2989 * R + 0.5870 * G + 0.1140 * B.

    Your program file `initial_program.py` must define `custom_kernel(data)` where
    `data = (rgb, output)`:
      - rgb:    (H, W, 3) float32 CUDA tensor (contiguous)
      - output: (H, W)    float32 CUDA tensor (pre-allocated, contiguous)
    Write the grayscale result in-place into `output` and return it.

    Correctness is checked against the PyTorch reference at rtol/atol=1e-4.
    Benchmark shapes: 1024², 2048², 4096², 8192² (always square images).

    Score = SCORE_SCALE / geom_mean_runtime_us (SCORE_SCALE = 3000.0).

  tips: |
    - Eval timeout is 600s.
    - The eval backend is fixed by the task config (grader.args below), so you
      do NOT need to set any GPUMODE_* environment variables — they have no
      effect on `coral eval`. Just write the kernel.
    - Memory coalescing matters: input is (H, W, 3), so per-pixel channels are
      stride-3 apart in the inner dim. Consider vectorized loads.
    - At least part of the kernel should run in Triton; pure PyTorch submissions
      pass correctness but get the slowest score.

grader:
  entrypoint: "grayscale_grader.grader:Grader"
  setup:
    - "uv pip install -e ./grader[modal]"
  timeout: 600
  direction: maximize
  args:
    program_file: "initial_program.py"
    # Backend selection, read by the grader worker directly (works even when the
    # host CORAL runs on has no CUDA, e.g. a Mac). Modal runs the eval on a cloud
    # GPU (needs Modal credentials + the `[modal]` extra above); set
    # use_modal: false to grade on a local CUDA box instead.
    use_modal: true
    modal_gpu: "H100"

agents:
  count: 2
  runtime: codex
  model: gpt-5.5
  runtime_options:
    model_reasoning_effort: high
  gateway:
    enabled: true
    port: 4000  # to be consistent with ./seed/opencode.json
    config: "./litellm_config.yaml"

workspace:
  results_dir: "./results"
  repo_path: "./examples/gpu_mode/grayscale/seed"
  setup:
    - "uv pip install torch numpy"

run:
  verbose: false
  ui: false
  session: tmux
