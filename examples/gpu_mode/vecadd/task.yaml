task:
  name: "GPU Mode: Vecadd"
  description: |
    Optimize a Triton kernel for element-wise float16 vector addition: C = A + B,
    where A and B are 2D float16 tensors on CUDA.

    Your program file `initial_program.py` must define `custom_kernel(data)` where
    `data = (a, b)` are two float16 CUDA tensors of the same shape, and the function
    returns the element-wise sum (also float16). Pure PyTorch is allowed, but at
    least part of the implementation should use Triton (`@triton.jit`).

    Correctness is checked against the PyTorch reference (a + b) with rtol/atol=1e-3.
    The kernel is benchmarked on shapes 1024², 2048², 4096², 8192².

    Score = SCORE_SCALE / geom_mean_runtime_us (SCORE_SCALE = 3000.0), so higher is
    faster.

  tips: |
    - Eval timeout is 600s.
    - The eval backend is fixed by the task config (grader.args below), so you do
      NOT need to set any GPUMODE_* environment variables — they have no effect on
      `coral eval`. Just write the kernel.
    - Output dtype MUST be float16. Output shape must match input shape.
    - Consider: BLOCK_SIZE tuning, @triton.autotune, vectorized loads, grid sizing
      for occupancy, memory coalescing on contiguous data.

grader:
  entrypoint: "vecadd_grader.grader:Grader"
  setup:
    # Add `[gpu]` if running locally on a CUDA box; add `[modal]` if using Modal cloud.
    - "uv pip install -e ./grader[modal]"
  timeout: 600
  direction: maximize
  args:
    program_file: "initial_program.py"
    # Backend selection. Modal runs the eval on a cloud GPU (requires Modal
    # credentials + the `[modal]` extra above); set use_modal: false to grade on
    # a local CUDA box instead. This is read by the grader worker directly, so it
    # works regardless of the host CORAL runs on (e.g. a Mac without CUDA).
    use_modal: true
    modal_gpu: "H100"

agents:
  count: 2
  runtime: codex
  model: gpt-5.5
  runtime_options:
    model_reasoning_effort: high
  gateway:
    enabled: true
    port: 4000  # to be consistent with ./seed/opencode.json
    config: "./litellm_config.yaml"

workspace:
  results_dir: "./results"
  repo_path: "./examples/gpu_mode/vecadd/seed"
  setup:
    # The grader handles correctness + benchmarking itself, so the agent's worktree
    # only needs torch + triton if the agent wants to test their kernel manually.
    - "uv pip install torch numpy"

run:
  verbose: false
  ui: false
  session: tmux
