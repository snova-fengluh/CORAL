[project]
name = "trimul-grader"
version = "0.1.0"
description = "CORAL grader for the GPU Mode trimul (Triangle Multiplicative Update) Triton kernel task."
requires-python = ">=3.11"
dependencies = [
    "coral",
    "torch>=2.2.0",
    "numpy",
]

[project.optional-dependencies]
modal = ["modal"]
gpu = ["triton>=3.0.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trimul_grader"]
