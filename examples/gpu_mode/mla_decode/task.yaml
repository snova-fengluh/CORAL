task:
  name: "GPU Mode: MLA Decode"
  description: |
    Optimize a Triton kernel for the Multi-head Latent Attention (MLA) decode
    operator from DeepSeek-V2/V3 — single-step decode with a compressed KV
    cache (LoRA projections + RoPE).

    Your program file `initial_program.py` must define `custom_kernel(data)` where
    `data = (config, x, kv_cache)`:
      - config:   reference.Config dataclass with model dims and projection weights
      - x:        (bs, 1, dim) bfloat16 CUDA tensor (the new decode token)
      - kv_cache: reference.KVCache module with prefill already loaded
    Return `(output, kv_cache.data)`:
      - output:        (bs, 1, dim) bfloat16 CUDA tensor
      - kv_cache.data: updated KV cache buffer

    `reference.py` (KVCache, Config, RoPE, MLA reference) is mirrored into
    `seed/` so your program can import it: `from reference import KVCache, Config`.
    Do not modify reference.py; only edit `initial_program.py`.

    Correctness is checked at rtol/atol=2e-2 in bfloat16.
    Score = SCORE_SCALE / geom_mean_runtime_us (SCORE_SCALE = 3000.0).
    Benchmarks: batchsize=128, dim=7168, dq=1536, prefill ∈ {4096, 6144}.

  tips: |
    - Eval timeout is 600s.
    - This benchmark needs an H200 (141 GB) — H100 (80 GB) doesn't fit. The
      backend is pinned to Modal H200 in grader.args below; you do NOT need to
      set any GPUMODE_* environment variables (they have no effect on `coral
      eval`). Just write the kernel.
    - The shared eval uses wall-clock timing + torch.no_grad() + 1% rel error
      (different from the other GPU Mode tasks).
    - Big wins typically come from fusing softmax + matmul + RoPE rather than
      adding new compute.

grader:
  entrypoint: "mla_decode_grader.grader:Grader"
  setup:
    - "uv pip install -e ./grader[modal]"
  timeout: 600
  direction: maximize
  args:
    program_file: "initial_program.py"
    # Backend selection, read by the grader worker directly (works even when the
    # host CORAL runs on has no CUDA, e.g. a Mac). Modal runs the eval on a cloud
    # GPU (needs Modal credentials + the `[modal]` extra above); set
    # use_modal: false to grade on a local CUDA box instead.
    use_modal: true
    modal_gpu: "H200"

agents:
  count: 2
  runtime: codex
  model: gpt-5.5
  runtime_options:
    model_reasoning_effort: high
  gateway:
    enabled: true
    port: 4000  # to be consistent with ./seed/opencode.json
    config: "./litellm_config.yaml"

workspace:
  results_dir: "./results"
  repo_path: "./examples/gpu_mode/mla_decode/seed"
  setup:
    - "uv pip install torch numpy"

run:
  verbose: false
  ui: false
  session: tmux
